[project]
name = "ledgerlens"
version = "0.1.0"
description = "Backend library for handling monetary amounts and currencies."
readme = "README.md"
authors = [
    { name = "KrystianHernas", email = "krystian.hernas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ledgerlens = "ledgerlens:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
